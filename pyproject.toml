[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superposition-replication"
version = "0.2.0"
description = "Replication and extension of Anthropic's Toy Models of Superposition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "transformers",
    "datasets",
    "evaluate",
    "sacrebleu",
    "sacremoses",
    "sentencepiece",
    "tensorboard",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "tqdm",
    "pyyaml",
    "nltk",
    "pandas",
]

[project.optional-dependencies]
wandb = ["wandb"]

[project.scripts]
superposition = "superposition.cli:main"

[tool.setuptools.packages.find]
include = ["superposition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
